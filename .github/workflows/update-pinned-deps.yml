name: Update pinned Python dependencies for the actions

on:
  push:
    branches: [main]
    paths: ['repo/pyproject.toml']
  schedule:
    - cron:  '21 9 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  update-dependencies:
    name: Update pinned Python dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write # for pushing a branch
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # for pushing a new branch later

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.15'
          version-file: uv.lock

      - name: Update uv.lock
        id: update
        run: |
          uv lock --upgrade --exclude-newer "7 days" 2>&1 | tee "$RUNNER_TEMP/uv-lock.txt"
          if git diff --quiet; then
            echo "No dependency updates."
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Push branch
        id: push
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add uv.lock
          git commit -m "uv: Update pinned requirements" -m "$(cat "$RUNNER_TEMP/uv-lock.txt")"
          SHA=$(sha256sum uv.lock)
          NAME="pin-requirements/${SHA:0:7}"
          if git ls-remote --exit-code origin $NAME; then
            echo "Branch $NAME exists, nothing to do."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git push origin HEAD:$NAME
            echo "Pushed branch $NAME."
            echo "pushed=true" >> $GITHUB_OUTPUT
            echo "branch=$NAME" >> $GITHUB_OUTPUT
          fi

      - name: Open pull request (and close old ones)
        if: steps.push.outputs.pushed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
        with:
          script: |
            const fs = require("fs");
            const lockOutput = fs.readFileSync(`${process.env.RUNNER_TEMP}/uv-lock.txt`, "utf8").trim();
            const title = "actions: Update pinned requirements";
            const body = `\`\`\`\n${lockOutput}\n\`\`\``;
            const openPrs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              head: process.env.BRANCH,
              base: "main",
            });

            for (const pr of openPrs.data) {
              if (pr.title === title) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  state: "closed",
                });
              }
            }
